name: TheCareers source sync
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/sync-sources-oidc.mjs'
      - '.github/workflows/source-sync.yml'

permissions:
  contents: read
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Get GitHub OIDC token
        shell: bash
        run: |
          RESPONSE=$(curl -fsSL -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=thecareers-supabase")
          TOKEN=$(printf '%s' "$RESPONSE" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).value))")
          echo "::add-mask::$TOKEN"
          echo "GITHUB_OIDC_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - run: node backend/sync-sources-oidc.mjs
        env:
          SUPABASE_GITHUB_BRIDGE_URL: https://cqqozlmsvysmxdkkxjbj.supabase.co/functions/v1/github-bridge
