name: TheCareers job scrape
on:
  # Hourly wake-up; the epoch-hour gate below runs the collector once per 5h
  # continuously (no 4-hour midnight gap). Manual runs remain available.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/scrape-oidc.mjs'
      - 'backend/challenge-fallback-oidc.mjs'
      - 'backend/hourly-job-audit.mjs'
      - 'backend/arbeitnow-ingest.mjs'
      - 'backend/skills/**'
      - 'package.json'
      - '.github/workflows/scrape.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: thecareers-job-scrape
  cancel-in-progress: false

jobs:
  cadence:
    runs-on: ubuntu-latest
    outputs:
      run_cycle: ${{ steps.slot.outputs.run_cycle }}
    steps:
      - name: Select one continuous five-hour time slot
        id: slot
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          hour=$(( $(date -u +%s) / 3600 ))
          if [ "$EVENT_NAME" != 'schedule' ] || [ "$(( hour % 5 ))" -eq 0 ]; then
            echo 'run_cycle=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_cycle=false' >> "$GITHUB_OUTPUT"
          fi
  scrape:
    needs: cadence
    if: needs.cadence.outputs.run_cycle == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check configured job API secrets
        shell: bash
        env:
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
          JOOBLE_KW_API_KEY: ${{ secrets.JOOBLE_KW_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: |
          for name in JSEARCH_API_KEY JOOBLE_KW_API_KEY ADZUNA_APP_ID ADZUNA_APP_KEY; do
            if [ -n "${!name}" ]; then
              echo "${name}=SET"
            else
              echo "${name}=MISSING"
            fi
          done

      - name: Get fresh GitHub OIDC token
        shell: bash
        run: |
          RESPONSE=$(curl -fsSL -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=thecareers-supabase")
          TOKEN=$(printf '%s' "$RESPONSE" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).value))")
          echo "::add-mask::$TOKEN"
          echo "GITHUB_OIDC_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Select light hourly or full twice-daily collector
        id: mode
        shell: bash
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != 'schedule' ] || [ "$SCHEDULE" = '17 0,12 * * *' ]; then
            echo 'full=true' >> "$GITHUB_OUTPUT"
            echo 'Full collector: browser, public fallback and verification.'
          else
            echo 'full=false' >> "$GITHUB_OUTPUT"
            echo 'Hourly light collector: public HTTP/RSS feeds and verification.'
          fi

      - name: Ingest Arbeitnow API
        shell: bash
        env:
          SUPABASE_GITHUB_BRIDGE_URL: https://cqqozlmsvysmxdkkxjbj.supabase.co/functions/v1/github-bridge
          ARBEITNOW_PAGES: '1'
        run: node backend/arbeitnow-ingest.mjs

      - name: Install Chromium for browser sources
        if: steps.mode.outputs.full == 'true'
        run: npx playwright install chromium

      - name: Run bounded scrape cycle
        shell: bash
        env:
          SUPABASE_GITHUB_BRIDGE_URL: https://cqqozlmsvysmxdkkxjbj.supabase.co/functions/v1/github-bridge
          SCRAPE_LIGHT_MODE: ${{ steps.mode.outputs.full == 'true' && '0' || '1' }}
          FULL_MODE: ${{ steps.mode.outputs.full }}
        run: |
          if [ "$FULL_MODE" = 'true' ]; then BUDGET=480; else BUDGET=120; fi
          set +e
          timeout --signal=TERM --kill-after=15s "${BUDGET}s" npm run scrape
          code=$?
          if [ "$code" -eq 124 ] || [ "$code" -eq 143 ]; then
            echo "Scrape time budget reached after ${BUDGET} seconds; hourly audit will still run."
            exit 0
          fi
          exit "$code"

      - name: Run challenge-safe public fallback
        if: always() && steps.mode.outputs.full == 'true'
        shell: bash
        env:
          SUPABASE_GITHUB_BRIDGE_URL: https://cqqozlmsvysmxdkkxjbj.supabase.co/functions/v1/github-bridge
        run: node backend/challenge-fallback-oidc.mjs

      - name: Audit published jobs and remove clearly expired listings
        if: always()
        shell: bash
        env:
          SUPABASE_GITHUB_BRIDGE_URL: https://cqqozlmsvysmxdkkxjbj.supabase.co/functions/v1/github-bridge
        run: node backend/hourly-job-audit.mjs
