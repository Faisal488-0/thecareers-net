name: TheCareers job scrape
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/scrape-oidc.mjs'
      - 'backend/skills/**'
      - 'package.json'
      - '.github/workflows/scrape.yml'
  schedule:
    # Every 2 hours. The actual crawl phase is capped at 5 minutes.
    - cron: '17 */2 * * *'

permissions:
  contents: read
  id-token: write

concurrency:
  group: thecareers-job-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npx playwright install chromium
      - name: Get fresh GitHub OIDC token
        shell: bash
        run: |
          RESPONSE=$(curl -fsSL -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=thecareers-supabase")
          TOKEN=$(printf '%s' "$RESPONSE" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).value))")
          echo "::add-mask::$TOKEN"
          echo "GITHUB_OIDC_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - name: Run bounded 5-minute scrape cycle
        shell: bash
        env:
          SUPABASE_GITHUB_BRIDGE_URL: https://cqqozlmsvysmxdkkxjbj.supabase.co/functions/v1/github-bridge
        run: |
          set +e
          timeout --signal=TERM --kill-after=15s 300s npm run scrape
          code=$?
          if [ "$code" -eq 124 ] || [ "$code" -eq 143 ]; then
            echo "Scrape time budget reached after 5 minutes; ending normally."
            exit 0
          fi
          exit "$code"
