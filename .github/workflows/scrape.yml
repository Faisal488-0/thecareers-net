name: TheCareers job scrape
on:
  # Hourly wake-up; the elapsed-time gate below runs the collector when >= 5h
  # have passed since the last executed scrape. Manual runs remain available.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/scrape-oidc.mjs'
      - 'backend/challenge-fallback-oidc.mjs'
      - 'backend/hourly-job-audit.mjs'
      - 'backend/arbeitnow-ingest.mjs'
      - 'backend/skills/**'
      - 'package.json'
      - '.github/workflows/scrape.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: thecareers-job-scrape
  cancel-in-progress: false

jobs:
  cadence:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      run_cycle: ${{ steps.slot.outputs.run_cycle }}
    steps:
      # GitHub throttles the hourly cron to irregular 4-6h gaps, so a fixed
      # epoch-hour slot (hour % 5 == 0) could be missed for days. Instead, run
      # whenever >= 5h have passed since the last scrape job that executed.
      - name: Run when five hours have passed since the last executed scrape
        id: slot
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          MIN_GAP_SECONDS: '18000'
        run: |
          if [ "$EVENT_NAME" != 'schedule' ]; then
            echo 'run_cycle=true' >> "$GITHUB_OUTPUT"; exit 0
          fi
          now=$(date -u +%s)
          last=''
          for id in $(gh api "repos/$REPO/actions/workflows/scrape.yml/runs?per_page=30" --jq ".workflow_runs[] | select(.id != $RUN_ID) | .id" 2>/dev/null); do
            started=$(gh api "repos/$REPO/actions/runs/$id/jobs" --jq '[.jobs[] | select(.name == "scrape" and .conclusion != "skipped" and .started_at != null) | .started_at][0] // empty' 2>/dev/null)
            if [ -n "$started" ]; then last="$started"; break; fi
          done
          if [ -z "$last" ]; then
            echo "No executed scrape found in recent history; running."
            echo 'run_cycle=true' >> "$GITHUB_OUTPUT"; exit 0
          fi
          gap=$(( now - $(date -u -d "$last" +%s) ))
          echo "Last executed scrape started at $last (${gap}s ago)."
          if [ "$gap" -ge "$MIN_GAP_SECONDS" ]; then
            echo 'run_cycle=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_cycle=false' >> "$GITHUB_OUTPUT"
          fi
  scrape:
    needs: cadence
    if: needs.cadence.outputs.run_cycle == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check configured job API secrets
        shell: bash
        env:
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
          JOOBLE_KW_API_KEY: ${{ secrets.JOOBLE_KW_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: |
          for name in JSEARCH_API_KEY JOOBLE_KW_API_KEY ADZUNA_APP_ID ADZUNA_APP_KEY; do
            if [ -n "${!name}" ]; then
              echo "${name}=SET"
            else
              echo "${name}=MISSING"
            fi
          done

      - name: Get fresh GitHub OIDC token
        shell: bash
        run: |
          RESPONSE=$(curl -fsSL -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=thecareers-supabase")
          TOKEN=$(printf '%s' "$RESPONSE" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).value))")
          echo "::add-mask::$TOKEN"
          echo "GITHUB_OIDC_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Select light or full collector
        id: mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          hour=$(( $(date -u +%s) / 3600 ))
          if [ "$EVENT_NAME" != 'schedule' ] || [ "$(( hour % 10 ))" -eq 0 ]; then
            echo 'full=true' >> "$GITHUB_OUTPUT"
            echo 'Full collector: browser, public fallback and verification.'
          else
            echo 'full=false' >> "$GITHUB_OUTPUT"
            echo 'Light collector: public HTTP/RSS feeds and verification.'
          fi

      - name: Ingest Arbeitnow API
        shell: bash
        env:
          SUPABASE_GITHUB_BRIDGE_URL: https://cqqozlmsvysmxdkkxjbj.supabase.co/functions/v1/github-bridge
          ARBEITNOW_PAGES: '1'
        run: node backend/arbeitnow-ingest.mjs

      - name: Install Chromium for browser sources
        if: steps.mode.outputs.full == 'true'
        run: npx playwright install chromium

      - name: Run bounded scrape cycle
        shell: bash
        env:
          SUPABASE_GITHUB_BRIDGE_URL: https://cqqozlmsvysmxdkkxjbj.supabase.co/functions/v1/github-bridge
          SCRAPE_LIGHT_MODE: ${{ steps.mode.outputs.full == 'true' && '0' || '1' }}
          FULL_MODE: ${{ steps.mode.outputs.full }}
        run: |
          if [ "$FULL_MODE" = 'true' ]; then BUDGET=480; else BUDGET=120; fi
          set +e
          timeout --signal=TERM --kill-after=15s "${BUDGET}s" npm run scrape
          code=$?
          if [ "$code" -eq 124 ] || [ "$code" -eq 143 ]; then
            echo "Scrape time budget reached after ${BUDGET} seconds; hourly audit will still run."
            exit 0
          fi
          exit "$code"

      - name: Run challenge-safe public fallback
        if: always() && steps.mode.outputs.full == 'true'
        shell: bash
        env:
          SUPABASE_GITHUB_BRIDGE_URL: https://cqqozlmsvysmxdkkxjbj.supabase.co/functions/v1/github-bridge
        run: node backend/challenge-fallback-oidc.mjs

      - name: Audit published jobs and remove clearly expired listings
        if: always()
        shell: bash
        env:
          SUPABASE_GITHUB_BRIDGE_URL: https://cqqozlmsvysmxdkkxjbj.supabase.co/functions/v1/github-bridge
        run: node backend/hourly-job-audit.mjs

  seo-pages-deploy:
    needs: scrape
    if: needs.scrape.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build fresh SEO job pages and sitemap
        run: node scripts/production-html-fix.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy refreshed Google Jobs pages
        id: deployment
        uses: actions/deploy-pages@v4
