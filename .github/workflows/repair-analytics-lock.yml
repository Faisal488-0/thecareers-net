name: One-time safe lockfile regeneration
on:
  push:
    branches:
      - fix/shamx-web-analytics-telegram-20261124
    paths:
      - package.json
      - .github/workflows/repair-analytics-lock.yml

permissions:
  contents: write

jobs:
  repair-lockfile:
    if: github.repository == 'Faisal488-0/thecareers-net'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regenerate deterministic lockfile without running dependency scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean dependency install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify existing high/critical security gate
        run: node scripts/security-audit-gate.mjs
      - name: Commit lockfile to this exact feature branch
        env:
          EXPECTED_BRANCH: fix/shamx-web-analytics-telegram-20261124
        run: |
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "security: regenerate lockfile with patched undici and no zod"
          git push origin "HEAD:refs/heads/$EXPECTED_BRANCH"
