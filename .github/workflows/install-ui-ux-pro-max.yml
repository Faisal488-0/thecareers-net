name: Install UI UX Pro Max Skill

on:
  push:
    branches:
      - chore/install-ui-ux-pro-max
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-skill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install UI UX Pro Max for Codex
        run: npm exec --yes --package=ui-ux-pro-max-cli -- uipro init --ai codex

      - name: Verify installation
        run: |
          test -f .agents/skills/ui-ux-pro-max/SKILL.md
          test -f .agents/skills/ui-ux-pro-max/scripts/search.py
          echo "UI UX Pro Max installed successfully"

      - name: Commit generated skill
        shell: bash
        run: |
          rm -f .github/workflows/install-ui-ux-pro-max.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "chore: install UI UX Pro Max skill"
          git push origin HEAD:${GITHUB_REF_NAME}
