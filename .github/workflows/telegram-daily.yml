name: All websites — Telegram visits every 8 hours

on:
  pull_request:
    paths:
      - 'backend/telegram-site-alerts.mjs'
      - '.github/workflows/telegram-daily.yml'
      - 'tests/telegram-site-alerts.test.mjs'
  schedule:
    # Run at 00:17, 08:17 and 16:17 Kuwait time (UTC+3).
    # Avoid the GitHub Actions top-of-hour peak; report windows remain aligned to 00/08/16.
    - cron: '17 5,13,21 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: all-websites-telegram-8h
  cancel-in-progress: false

jobs:
  consolidated-visits:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test consolidated analytics logic (no network or secrets)
        run: node --test tests/telegram-site-alerts.test.mjs
      - name: Verify required GitHub Actions secrets
        if: github.event_name != 'pull_request'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CF_ANALYTICS_API_TOKEN: ${{ secrets.CF_ANALYTICS_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          missing=0
          for secret in SUPABASE_SERVICE_ROLE_KEY TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID CF_ANALYTICS_API_TOKEN; do
            if [ -z "${!secret}" ]; then
              echo "::error title=Missing secret::${secret} is not configured in repository Actions secrets."
              missing=1
            fi
          done
          exit "$missing"
      - name: Send exactly one aggregated visits message
        if: github.event_name != 'pull_request'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CF_ANALYTICS_API_TOKEN: ${{ secrets.CF_ANALYTICS_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: node backend/telegram-site-alerts.mjs
