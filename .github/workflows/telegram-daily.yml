name: All websites — Telegram visits every 8 hours

on:
  schedule:
    # 00:00, 08:00 and 16:00 Kuwait time (UTC+3).
    - cron: '0 5,13,21 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/telegram-report-smoke-test.txt'

permissions:
  contents: read

concurrency:
  group: all-websites-telegram-8h
  cancel-in-progress: false

jobs:
  consolidated-visits:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Send exactly one aggregated visits message
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node backend/telegram-site-alerts.mjs
