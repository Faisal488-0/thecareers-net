name: Free Browser QA — TheCareers

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Public URL to inspect with a local Chromium browser
        required: true
        default: https://thecareers.net/
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'config.js'
      - 'assets/**'
      - 'qa/free-browser-qa.cjs'
      - '.github/workflows/browser-use-qa.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: thecareers-browser-qa
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_URL: ${{ inputs.target_url || 'https://thecareers.net/' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish QA start marker
        shell: bash
        env:
          SUPABASE_GITHUB_BRIDGE_URL: https://cqqozlmsvysmxdkkxjbj.supabase.co/functions/v1/github-bridge
        run: |
          node <<'NODE'
          async function main(){
            const req=process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
            const auth=process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
            const sep=req.includes('?')?'&':'?';
            const tr=await fetch(req+sep+'audience=thecareers-supabase',{headers:{Authorization:'Bearer '+auth}});
            const tj=await tr.json();
            const body={action:'event',message:`Browser QA START — run ${process.env.GITHUB_RUN_ID||'unknown'}`,level:'info',meta:{via:'github_browser_qa_start',github_run_id:process.env.GITHUB_RUN_ID||null,github_sha:process.env.GITHUB_SHA||null,target:process.env.TARGET_URL||''}};
            const r=await fetch(process.env.SUPABASE_GITHUB_BRIDGE_URL,{method:'POST',headers:{Authorization:'Bearer '+tj.value,'Content-Type':'application/json'},body:JSON.stringify(body)});
            if(!r.ok)throw new Error(await r.text());
          }
          main().catch(e=>{console.error(e);process.exitCode=1});
          NODE

      - name: Wait for Pages deployment on push
        if: github.event_name == 'push'
        run: sleep 35

      - name: Install free local browser QA stack
        shell: bash
        run: |
          rm -rf /tmp/free-browser-qa
          npm install --prefix /tmp/free-browser-qa --no-save --package-lock=false playwright@1.55.1
          /tmp/free-browser-qa/node_modules/.bin/playwright install --with-deps chromium

      - name: Audit TheCareers in local Chromium
        run: node qa/free-browser-qa.cjs

      - name: Publish QA result to TheCareers audit log
        if: always()
        shell: bash
        env:
          SUPABASE_GITHUB_BRIDGE_URL: https://cqqozlmsvysmxdkkxjbj.supabase.co/functions/v1/github-bridge
        run: |
          node <<'NODE'
          const fs=require('fs');
          async function main(){
            let report={summary:{failedAssertions:999,criticalBrowserFailures:999}};
            try{report=JSON.parse(fs.readFileSync('qa/free-browser-output/report.json','utf8'))}catch{}
            const req=process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
            const auth=process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
            const sep=req.includes('?')?'&':'?';
            const tr=await fetch(req+sep+'audience=thecareers-supabase',{headers:{Authorization:'Bearer '+auth}});
            const tj=await tr.json();
            const failed=Number(report?.summary?.failedAssertions||0);
            const critical=Number(report?.summary?.criticalBrowserFailures||0);
            const pass=failed===0&&critical===0;
            const body={
              action:'event',
              message:`Browser QA ${pass?'PASS':'FAIL'} — run ${process.env.GITHUB_RUN_ID||'unknown'} — assertions ${failed}, critical ${critical}`,
              level:pass?'ok':'warning',
              meta:{via:'github_browser_qa',github_run_id:process.env.GITHUB_RUN_ID||null,github_sha:process.env.GITHUB_SHA||null,failed_assertions:failed,critical_browser_failures:critical,target:report?.target||process.env.TARGET_URL||'',generated_at:report?.generatedAt||null,fatal:Boolean(report?.fatal),error:report?.error||null}
            };
            const r=await fetch(process.env.SUPABASE_GITHUB_BRIDGE_URL,{method:'POST',headers:{Authorization:'Bearer '+tj.value,'Content-Type':'application/json'},body:JSON.stringify(body)});
            if(!r.ok)throw new Error(await r.text());
          }
          main().catch(e=>{console.error(e);process.exitCode=1});
          NODE

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thecareers-free-browser-qa-${{ github.run_id }}
          path: qa/free-browser-output
          if-no-files-found: warn
          retention-days: 3
