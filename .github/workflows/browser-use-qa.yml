name: Free Browser QA — TheCareers

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Public URL to inspect with a local Chromium browser
        required: true
        default: https://thecareers.net/
  schedule:
    - cron: '17 1 * * *'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_URL: ${{ inputs.target_url || 'https://thecareers.net/' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install free local browser QA stack
        shell: bash
        run: |
          rm -rf /tmp/free-browser-qa
          npm install --prefix /tmp/free-browser-qa --no-save --package-lock=false playwright@1.55.1
          /tmp/free-browser-qa/node_modules/.bin/playwright install --with-deps chromium

      - name: Audit TheCareers in local Chromium
        run: node qa/free-browser-qa.cjs

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thecareers-free-browser-qa-${{ github.run_id }}
          path: qa/free-browser-output
          if-no-files-found: warn
          retention-days: 14
