name: Website Preflight

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate complete card descriptions
        run: node --check assets/job-summary.js && node --check assets/backend-bridge.js && node --test tests/job-summary.test.cjs
      - name: Run website preflight
        run: node scripts/site-preflight.mjs
